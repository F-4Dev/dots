# Generated by HyprMod

decoration:blur:popups = 1
ecosystem:enforce_permissions = 0
general:allow_tearing = 1
general:border_size = 2
general:gaps_out = 3
general:layout = dwindle
general:resize_on_border = 0
general:snap:border_overlap = 0
general:snap:enabled = 1
general:snap:respect_gaps = 0
input:accel_profile = adaptive
input:float_switch_override_focus = 0
input:scroll_factor = 1.0
misc:animate_manual_resizes = 1
misc:animate_mouse_windowdragging = 1
misc:key_press_enables_dpms = 0
misc:mouse_move_enables_dpms = 1
misc:vrr = 1

# Bezier curves
bezier = hyprcurve, 1.0, 0.27, 0.0, 0.171

# Animations
animation = global, 1, 5.0, hyprcurve
animation = workspaces, 1, 2.0, hyprcurve, slidevert

# Monitors
monitor = DP-1, 3840x2160@165.00Hz, 1920x-1090, 1.25, bitdepth, 10, vrr, 3
monitor = HDMI-A-1, 1920x1080@100.05Hz, 5002x-430, 1, cm, srgb

# Keybinds
unbind = SUPER SHIFT, right
bind = SUPER SHIFT, Left, swapwindow, l
bind = SUPER SHIFT, Right, swapwindow, r
